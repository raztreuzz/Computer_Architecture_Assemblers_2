<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio de Sesion 💡💡</title>
    <!-- Incluir Tailwind desde la CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Asegura que el footer se quede al fondo */
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .content {
            flex-grow: 1;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Contenedor principal -->
    <div class="container mx-auto p-6 content">
        <!-- Encabezado -->
        <header class="mb-6">
            <h1 class="text-4xl font-bold text-center text-gray-800">Bienvenido a CorvusSoftware</h1>
            <p class="text-center text-gray-600 mt-2">Conéctate a tu red WiFi y controla tus dispositivos Smart.</p>
        </header>

        <!-- Logo -->
        <div class="flex items-center justify-center mb-8">
            <img src="../sources/logo.png" alt="Logo CorvusSoftware" class="w-24 h-24">
        </div>

        <!-- Formulario -->
        <form class="max-w-sm mx-auto bg-white p-6 rounded-lg shadow-md">
            <div class="mb-4">
                <label for="network_name" class="block text-sm font-medium text-gray-600">Nombre de la red</label>
                <input type="text" id="network_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-3 mt-1" placeholder="Ej. MiRedWiFi" required />
            </div>
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-600">Contraseña</label>
                <input type="password" id="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg w-full p-3 mt-1" required />
            </div>
            <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm py-2.5 mt-4 focus:outline-none">Conectar</button>
        </form>

        <!-- Tarjeta -->
        <div class="bg-white shadow-lg rounded-lg p-6 mt-8 mx-auto max-w-sm">
            <h2 class="text-xl font-semibold text-gray-800">Dispositivos Smart 💡</h2>
            <p class="text-sm text-gray-600 mt-2">
                Ingresa el nombre y la clave de tu red WiFi para conectarte.
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white rounded-lg shadow-sm m-4 dark:bg-gray-800">
        <div class="w-full mx-auto max-w-screen-xl p-4 md:flex md:items-center md:justify-between">
            <span class="text-sm text-gray-500 sm:text-center dark:text-gray-400">© 2025 <a href="https://Corvus_Software.com/" class="hover:underline">Corvus Corvus_Software™</a>. All Rights Reserved.</span>
            <!-- Lista de enlaces -->
            <ul class="flex flex-wrap items-center mt-3 text-sm font-medium text-gray-500 dark:text-gray-400 sm:mt-0">
                <li class="w-full sm:w-auto">
                    <a href="#" class="hover:underline">Contact: raztreuzz1234@gmail.com</a>
                </li>
            </ul>
        </div>
    </footer>
    

</body>
</html>
