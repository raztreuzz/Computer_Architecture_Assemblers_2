<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Smart Home 🏡🏡</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.2/dist/tailwind.min.css" rel="stylesheet">
    <link href="../styles/styles.css" rel="stylesheet">
    <script>
        // Función para alternar entre las imágenes de los íconos
        function toggleLight(element, imageElement) {
            const isChecked = element.checked;
            console.log(isChecked ? "Encendido" : "Apagado");
            if (isChecked) {
                imageElement.src = "../sources/Light_on.png";
            } else {
                imageElement.src = "../sources/Light_off.png";
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 p-4 md:p-6 text-white text-center">
        <h1 class="text-2xl md:text-4xl font-bold">Smart Home</h1>
    </header>

    <!-- Contenedor principal -->
    <main class="container mx-auto p-4 md:p-6 flex flex-col items-center flex-grow">

        <h2 class="text-xl md:text-2xl font-semibold mb-4 md:mb-6">Dispositivos</h2>

        <!-- Fila de dispositivos -->
        <div class="flex flex-col md:flex-row justify-center items-center gap-4 md:gap-6 mb-6 md:mb-8 w-full">

            <!-- Dispositivo 1 -->
            <div class="device-box">
                <p class="device-title">Living Room</p>
                <img src="../sources/Light_off.png" alt="light" class="device-icon" id="lightimg1">
                <label class="switch">
                    <input type="checkbox" id="lightswitch1" onchange="toggleLight(this, document.getElementById('lightimg1'))">
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Dispositivo 2 -->
            <div class="device-box">
                <p class="device-title">Kitchen</p>
                <img src="../sources/Light_off.png" alt="light" class="device-icon" id="lightimg2">
                <label class="switch">
                    <input type="checkbox" id="lightswitch2" onchange="toggleLight(this, document.getElementById('lightimg2'))">
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Dispositivo 3 -->
            <div class="device-box">
                <p class="device-title">Bedroom</p>
                <img src="../sources/Light_off.png" alt="light" class="device-icon" id="lightimg3">
                <label class="switch">
                    <input type="checkbox" id="lightswitch3" onchange="toggleLight(this, document.getElementById('lightimg3'))">
                    <span class="slider round"></span>
                </label>
            </div>

            <!-- Botón para agregar dispositivo -->
            <div class="device-box flex items-center justify-center">
                <button type="button" class="inline-flex items-center justify-center w-12 h-12 md:w-16 md:h-16 font-medium bg-blue-600 rounded-full hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 focus:outline-none transition-all transform hover:scale-110 shadow-lg">
                    <svg class="w-6 h-6 md:w-8 md:h-8 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 18">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 1v16M1 9h16"/>
                    </svg>
                    <span class="sr-only">Agregar dispositivo</span>
                </button>
            </div>

        </div>

        <!-- Banner de administración de dispositivos -->
        <div class="manage-devices-banner">
            <h2>Administrar Dispositivos</h2>
        </div>

        <!-- Lista de dispositivos para administración -->
        <div class="devices-admin-container">
            <div class="admin-device-box">
                <p class="device-title">Living Room</p>
                <button class="rename-btn">Cambiar Nombre</button>
                <button class="delete-btn">Eliminar Dispositivo</button>
            </div>

            <div class="admin-device-box">
                <p class="device-title">Kitchen</p>
                <button class="rename-btn">Cambiar Nombre</button>
                <button class="delete-btn">Eliminar Dispositivo</button>
            </div>

            <div class="admin-device-box">
                <p class="device-title">Bedroom</p>
                <button class="rename-btn">Cambiar Nombre</button>
                <button class="delete-btn">Eliminar Dispositivo</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="page-footer">
        <div class="footer-content">
            <span class="copyright">© 2025 <a href="https://Corvus_Software.com/">Corvus Corvus_Software™</a>. All Rights Reserved.</span>
            <ul class="footer-links">
                <li>
                    <a href="#">Contact: raztreuzz1234@gmail.com</a>
                </li>
            </ul>
        </div>
    </footer>

</body>
</html>
