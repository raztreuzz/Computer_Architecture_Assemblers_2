<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home 🏡🏡</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.2/dist/tailwind.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="flex flex-col min-h-screen bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow py-4">
        <h1 class="text-2xl font-bold text-center text-gray-800">Smart Home</h1>
    </header>

    <!-- Contenedor principal -->
    <div class="flex flex-1 p-4 gap-4">
        <!-- Sección dispositivos -->
        <section class="w-3/5 bg-white rounded-lg shadow p-6">
            <!-- Sección Focos -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold flex items-center text-gray-700">
                        <i class="fas fa-lightbulb mr-2"></i>
                        Focos FH100 
                        <span id="lightCounter" class="counter ml-2 text-gray-600">0/4</span>
                    </h2>
                </div>
                <div id="focosContainer" class="grid grid-cols-2 gap-4 mt-4">
                    <!-- Focos se cargarán aquí -->
                </div>
            </div>

            <!-- Sección Sensores -->
            <div id="sensorSection" class="sensor-section">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold flex items-center text-gray-700">
                        <i class="fas fa-thermometer-half mr-2"></i>
                        Sensores SH
                        <span id="sensorCounter" class="counter ml-2 text-gray-600">0/1</span>
                    </h2>
                </div>
                <div id="sensorContainer" class="mt-4">
                    <!-- Sensores se cargarán aquí -->
                </div>
            </div>

            <!-- Botón Apagar Todo -->
            <div class="mt-6">
                <button id="turnOffAllBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg flex items-center mx-auto">
                    <i class="fas fa-power-off mr-2"></i>
                    Apagar todo
                </button>
            </div>
        </section>

        <!-- Sección información -->
        <section class="w-2/5 bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Información del Sistema</h2>
            <div class="space-y-4">
                <div>
                    <h3 class="font-medium text-gray-600">Dispositivos conectados</h3>
                    <p id="connectedDevices" class="text-lg font-semibold">0</p>
                </div>
                <div>
                    <h3 class="font-medium text-gray-600">Estado del sistema</h3>
                    <p class="text-green-600 font-semibold"><i class="fas fa-check-circle mr-1"></i> Operativo</p>
                </div>
                <div>
                    <h3 class="font-medium text-gray-600">Última actualización</h3>
                    <p id="lastUpdate" class="text-gray-700">Nunca</p>
                </div>
            </div>

            <!-- Dispositivos registrados -->
            <div class="bg-gray-50 rounded-lg p-4 mt-8">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-700">
                        <i class="fas fa-list mr-2"></i> Tus Dispositivos
                    </h2>
                    <button id="addDeviceBtn" class="text-blue-600 hover:text-blue-800 text-sm">
                        <i class="fas fa-plus-circle mr-1"></i> Añadir
                    </button>
                </div>
                <div id="devicesList" class="space-y-2">
                    <!-- Lista de dispositivos -->
                </div>
            </div>
        </section>
    </div>

    <!-- Modal para añadir dispositivo -->
    <div id="espModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Registrar Nuevo Dispositivo</h3>
                    <button class="close-modal text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                </div>
                
                <div id="currentEspInfo" class="mb-4 p-4 bg-blue-50 rounded-lg">
                    <h4 class="font-medium text-blue-800 mb-2">Dispositivo detectado:</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <p class="text-sm text-gray-600">Tipo:</p>
                            <p id="espType" class="font-medium">--</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-600">Número de serie:</p>
                            <p id="espSerial" class="font-medium">--</p>
                        </div>
                    </div>
                </div>

                <form id="espForm" class="space-y-4">
                    <div>
                        <label for="deviceName" class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" id="deviceName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label for="deviceLocation" class="block text-sm font-medium text-gray-700">Ubicación</label>
                        <input type="text" id="deviceLocation" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" class="close-modal px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                            Registrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="{{ url_for('static', filename='script_2.js') }}"></script>
</body>
</html>
