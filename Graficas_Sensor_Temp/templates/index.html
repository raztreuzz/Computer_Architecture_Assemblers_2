<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monitor de Temperatura y Humedad</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="{{ url_for('static', filename='mqtt.min.js') }}"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="mb-4">🌡️ Monitor de Temperatura y Humedad 💧</h1>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title">📊 Datos en tiempo real</h5>
                        <p class="card-text">
                            🌡️ <strong>Temperatura:</strong> <span id="temp" class="text-danger fw-bold">--</span> °C
                        </p>
                        <p class="card-text">
                            💧 <strong>Humedad:</strong> <span id="hum" class="text-primary fw-bold">--</span> %
                        </p>
                        <p class="card-text">
                            🔥​ <strong>Sensación Térmica:</strong> <span id="sensacion" class="text-success fw-bold">--</span> °C
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h3>Temperatura</h3>
            <svg id="grafica-temp" width="700" height="300" class="border rounded shadow"></svg>
        </div>

        <div class="mt-4">
            <h3>Humedad</h3>
            <svg id="grafica-hum" width="700" height="300" class="border rounded shadow"></svg>
        </div>

        <div class="mt-4">
            <h3>Sensación Térmica</h3>
            <svg id="grafica-sensacion" width="700" height="300" class="border rounded shadow"></svg>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
